                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: '6px' }}>
                          <button onClick={() => alert('Coordinate Bonifico inviate!')} style={{ background: '#fff', border: '1px solid #cbd5e1', padding: '6px', borderRadius: '4px', fontSize: '11px', fontWeight: '600', cursor: 'pointer' }}>🏦 Bonifico</button>
                          <button onClick={() => alert('Link PayPal generato!')} style={{ background: '#fff', border: '1px solid #bfdbfe', padding: '6px', borderRadius: '4px', fontSize: '11px', fontWeight: '600', color: '#1d4ed8', cursor: 'pointer' }}>🅿️ PayPal</button>
                          <button onClick={() => alert('Link Scalapay generato!')} style={{ background: '#fff', border: '1px solid #fde68a', padding: '6px', borderRadius: '4px', fontSize: '11px', fontWeight: '600', color: '#92400e', cursor: 'pointer' }}>💳 Scalapay</button>
                          <button onClick={() => alert('Link Klarna generato!')} style={{ background: '#fff', border: '1px solid #fbcfe8', padding: '6px', borderRadius: '4px', fontSize: '11px', fontWeight: '600', color: '#be185d', cursor: 'pointer' }}>🛍️ Klarna</button>
                        </div>
                      </div>
                    )}
                  </>
                )}

                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <button onClick={() => setShowModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>Chiudi</button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE PERSONALIZZAZIONE TARIFFARIO BRINDISI */}
          {showBrindisiTariffModal && isBrindisi && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: '0', background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000 }}>
              <div style={{ background: '#fff', padding: '30px', borderRadius: '8px', width: '600px', maxWidth: '90%' }}>
                <h3 style={{ margin: '0 0 10px 0', color: '#ea580c' }}>⚙️ Personalizza il Tuo Tariffario (Sede Brindisi)</h3>
                <div style={{ background: '#f8fafc', padding: '15px', borderRadius: '6px', border: '1px solid #e2e8f0', marginBottom: '20px' }}>
                  {tariffarioBrindisi.map((t, idx) => (
                    <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px', fontSize: '13px' }}>
                      <span><strong>{t.servizio}</strong></span>
                      <input 
                        type="text" 
                        value={t.studio} 
                        onChange={(e) => {
                          const updated = [...tariffarioBrindisi];
                          updated[idx].studio = e.target.value;
                          setTariffarioBrindisi(updated);
                        }}
                        style={{ padding: '6px', width: '100px', borderRadius: '4px', border: '1px solid #cbd5e1', fontWeight: 'bold', textAlign: 'center' }} 
                      />
                    </div>
                  ))}
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <button onClick={() => setShowBrindisiTariffModal(false)} style={{ background: '#ea580c', color: '#fff', border: 'none', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>
                    Salva Modifiche
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE GENERATORE LINK OTP / QR CODE NO-SPID */}
          {showNoSpidModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: '0', background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000 }}>
              <div style={{ background: '#fff', padding: '30px', borderRadius: '8px', width: '550px', maxWidth: '90%' }}>
                <h3 style={{ margin: '0 0 10px 0', color: '#0f766e' }}>📲 Accesso Documenti Isolato (Senza SPID / CIE)</h3>
                <input type="text" value={clienteNoSpidName} onChange={(e) => setClienteNoSpidName(e.target.value)} placeholder="Nome e Cognome Cliente..." style={{ width: '100%', padding: '10px', marginBottom: '10px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                <input type="text" value={clienteNoSpidPhone} onChange={(e) => setClienteNoSpidPhone(e.target.value)} placeholder="Cellulare per SMS / WhatsApp..." style={{ width: '100%', padding: '10px', marginBottom: '15px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                <button onClick={generaAccessoSenzaSpid} style={{ width: '100%', background: '#0d9488', color: '#fff', border: 'none', padding: '12px', borderRadius: '6px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '15px' }}>
                  🔐 Genera Link Personale + PIN OTP
                </button>
                {generatedToken && (
                  <div style={{ background: '#f0fdfa', border: '1px solid #99f6e4', padding: '15px', borderRadius: '6px', marginBottom: '15px', fontSize: '13px' }}>
                    <p style={{ margin: '4px 0' }}>🔗 Link: <code>{generatedToken.link}</code></p>
                    <p style={{ margin: '4px 0' }}>🔑 PIN OTP: <strong>{generatedToken.pin}</strong></p>
                  </div>
                )}
                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <button onClick={() => setShowNoSpidModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>Chiudi</button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE NUOVA PRATICA */}
          {showSportelloModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: '0', background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000 }}>
              <div style={{ background: '#fff', padding: '30px', borderRadius: '8px', width: '520px', maxWidth: '90%' }}>
                <h3 style={{ margin: '0 0 15px 0' }}>+ Nuova Pratica / Inserimento</h3>
                <input type="text" value={nuovoClienteNome} onChange={(e) => setNuovoClienteNome(e.target.value)} placeholder="Nome e Cognome Cliente..." style={{ width: '100%', padding: '8px', marginBottom: '12px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                <input type="text" value={nuovoClienteCf} onChange={(e) => setNuovoClienteCf(e.target.value)} placeholder="Codice Fiscale (Isolamento GDPR)..." style={{ width: '100%', padding: '8px', marginBottom: '12px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', marginBottom: '4px' }}>Tipologia Cliente:</label>
                <select 
                  value={nuovoTipoCliente} 
                  onChange={(e) => {
                    setNuovoTipoCliente(e.target.value);
                    if (e.target.value === 'Convenzionato') setAggiungiQuotaAssociativa(true);
                    else setAggiungiQuotaAssociativa(false);
                  }}
                  style={{ width: '100%', padding: '8px', marginBottom: '12px', borderRadius: '4px', border: '1px solid #cbd5e1' }}
                >
                  <option value="Occasionale">Cliente Occasionale (Studio)</option>
                  <option value="Convenzionato">Cliente Convenzionato (Quota Associativa € 25,00)</option>
                </select>

                {nuovoTipoCliente === 'Convenzionato' && isFirenze && (
                  <div style={{ background: '#fef3c7', padding: '10px', borderRadius: '4px', marginBottom: '12px', fontSize: '12px', color: '#92400e' }}>
                    <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', fontWeight: '600' }}>
                      <input type="checkbox" checked={aggiungiQuotaAssociativa} onChange={(e) => setAggiungiQuotaAssociativa(e.target.checked)} />
                      Associa cliente con Quota Annuale di € 25,00
                    </label>
                  </div>
                )}

                <div style={{ background: '#f0fdf4', padding: '10px', borderRadius: '4px', marginBottom: '12px', fontSize: '12px', color: '#166534' }}>
                  <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', fontWeight: '600' }}>
                    <input type="checkbox" checked={soloCaricamentoDocumenti} onChange={(e) => setSoloCaricamentoDocumenti(e.target.checked)} />
                    Solo Inserimento / Invio Documenti (Gratuito € 0,00)
                  </label>
                </div>
                {!soloCaricamentoDocumenti && (
                  <>
                    <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', marginBottom: '4px' }}>Tipo di Pratica / Servizio:</label>
                    <select
                      value={nuovoServizio}
                      onChange={(e) => setNuovoServizio(e.target.value)}
                      style={{ width: '100%', padding: '8px', marginBottom: '12px', borderRadius: '4px', border: '1px solid #cbd5e1' }}
                    >
                      <option value="Modello 730 Singolo">Modello 730 Singolo</option>
                      <option value="ISEE / DSU Ordinario">ISEE / DSU Ordinario</option>
                      <option value="Dichiarazione di Successione + Voltura">Dichiarazione di Successione + Voltura</option>
                      <option value="Pratica Previdenziale / Patronato">Pratica Previdenziale / Patronato</option>
                      <option value="Cedolino / Contratto Lavoro">Cedolino / Contratto Lavoro</option>
                      <option value="IMU / Visure / Pratica Fiscale">IMU / Visure / Pratica Fiscale</option>
                    </select>
                  </>
                )}
                {!soloCaricamentoDocumenti && (
                  <>
                    <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', marginBottom: '4px' }}>Tipo di Pratica / Servizio:</label>
                    <select
                      value={nuovoServizio}
                      onChange={(e) => setNuovoServizio(e.target.value)}
                      style={{ width: '100%', padding: '8px', marginBottom: '12px', borderRadius: '4px', border: '1px solid #cbd5e1' }}
                    >
                      <option value="Modello 730 Singolo">Modello 730 Singolo</option>
                      <option value="ISEE / DSU Ordinario">ISEE / DSU Ordinario</option>
                      <option value="Dichiarazione di Successione + Voltura">Dichiarazione di Successione + Voltura</option>
                      <option value="Pratica Previdenziale / Patronato">Pratica Previdenziale / Patronato</option>
                      <option value="Cedolino / Contratto Lavoro">Cedolino / Contratto Lavoro</option>
                      <option value="IMU / Visure / Pratica Fiscale">IMU / Visure / Pratica Fiscale</option>
                    </select>
                  </>
                )}
                {!soloCaricamentoDocumenti && (
                  <select value={nuovoCanaleIva} onChange={(e) => setNuovoCanaleIva(e.target.value)} style={{ width: '100%', padding: '8px', marginBottom: '12px', borderRadius: '4px', border: '1px solid #cbd5e1' }}>
                    <option value="studio">Canale Studio Commercialista (+ IVA 22%)</option>
                    <option value="caf">Canale Esclusivo CAF (Esente IVA)</option>
                  </select>
                )}

                <input type="text" value={nuovoPromemoria} onChange={(e) => setNuovoPromemoria(e.target.value)} placeholder="Nota promemoria Standby (opzionale)..." style={{ width: '100%', padding: '8px', marginBottom: '15px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px' }}>
                  <button onClick={() => setShowSportelloModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer' }}>Annulla</button>
                  <button onClick={aggiungiNuovaPratica} style={{ background: '#2563eb', color: '#fff', border: 'none', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>Salva Pratica</button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE CASSA FIRENZE */}
          {showCassaModal && isFirenze && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: '0', background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000 }}>
              <div style={{ background: '#fff', padding: '30px', borderRadius: '8px', width: '500px', maxWidth: '90%' }}>
                <h3 style={{ margin: '0 0 10px 0' }}>💶 Cassa Firenze & Prima Nota</h3>
                <p style={{ fontSize: '13px', color: '#64748b', marginBottom: '15px' }}>Gestione incassi in contanti e POS esclusivi della sede di Firenze (invisibili a Brindisi).</p>
                <div style={{ background: '#f8fafc', padding: '15px', borderRadius: '6px', border: '1px solid #e2e8f0', marginBottom: '15px', fontSize: '13px' }}>
                  <p style={{ margin: '4px 0' }}>💵 <strong>Incassi Contanti & Quote Associative (€ 25):</strong> € 165,00</p>
                  <p style={{ margin: '4px 0' }}>💳 <strong>Incassi POS Studio:</strong> € 285,00</p>
                  <p style={{ margin: '4px 0' }}>🌐 <strong>Incassi Digitali (Bonifico/PayPal/Scalapay/Klarna):</strong> € 450,00</p>
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <button onClick={() => setShowCassaModal(false)} style={{ background: '#2563eb', color: '#fff', border: 'none', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>Chiudi</button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE CASSAFORTE RECIPROCA & FLUSSI QWEB / ADE */}
          {showVaultModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: '0', background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000 }}>
              <div style={{ background: '#fff', padding: '30px', borderRadius: '8px', width: '600px', maxWidth: '90%' }}>
                <h3 style={{ margin: '0 0 10px 0' }}>🔐 Cassaforte Credenziali & Connettori (QWeb / AdE)</h3>
                <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '13px', marginBottom: '15px' }}>
                  <thead>
                    <tr style={{ background: '#f8fafc', borderBottom: '2px solid #e2e8f0' }}>
                      <th style={{ padding: '8px' }}>Sede / Ente</th>
                      <th style={{ padding: '8px' }}>Portale / Software</th>
                      <th style={{ padding: '8px' }}>Stato</th>
                    </tr>
                  </thead>
                  <tbody>
                    {credentials.map(c => (
                      <tr key={c.id} style={{ borderBottom: '1px solid #f1f5f9' }}>
                        <td style={{ padding: '8px', fontWeight: 'bold' }}>{c.sede}</td>
                        <td style={{ padding: '8px' }}>{c.portale}</td>
                        <td style={{ padding: '8px', color: '#059669' }}>{c.pin}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <button onClick={() => setShowVaultModal(false)} style={{ background: '#2563eb', color: '#fff', border: 'none', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>Chiudi</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudioFlowSuite />);
  </script>
</body>
</html>
