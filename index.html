        const oggi = new Date();
        if (isNaN(nascita.getTime())) return { anni: 0, mesi: 0, decimale: 0 };
        let anni = oggi.getFullYear() - nascita.getFullYear();
        let mesi = oggi.getMonth() - nascita.getMonth();
        if (oggi.getDate() < nascita.getDate()) mesi -= 1;
        if (mesi < 0) {
          anni -= 1;
          mesi += 12;
        }
        const decimale = Math.max(0, anni + mesi / 12);
        return { anni: Math.max(0, anni), mesi: Math.max(0, mesi), decimale };
      };

              <div style={{ background: '#fff', padding: '24px', borderRadius: '8px', maxWidth: '620px', width: '100%', maxHeight: '90vh', overflowY: 'auto' }}>
                <h3 style={{ marginTop: 0 }}>📤 Ponte Dati Standardizzato (QWeb Zucchetti / Cesac / INPS)</h3>
                <p style={{ fontSize: '13px', color: '#475569', marginTop: 0 }}>
                  Copia questo tracciato CSV strutturato per riallineare o passare le pratiche verso flussi/gestionali esterni (QWeb, Cesac, fogli di lavorazione INPS) in attesa di assorbire internamente le relative funzioni.
                </p>
                <textarea
                  readOnly
                  value={generaCsvFlusso()}
                  rows={8}
                  style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #cbd5e1', fontSize: '11px', fontFamily: 'monospace', boxSizing: 'border-box' }}
                />
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '14px' }}>
                  <button
                    onClick={() => {
                      navigator.clipboard?.writeText(generaCsvFlusso());
                      alert('Tracciato CSV copiato negli appunti!');
                    }}
                    style={{ background: '#2563eb', color: '#fff', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}
                  >
                    Copia CSV
                  </button>
                  <button onClick={() => setShowExportModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer' }}>
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE LINK / QR NO-SPID */}
          {showNoSpidModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '25px', borderRadius: '8px', maxWidth: '460px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>📲 Genera Accesso Protetto No-SPID</h3>
                <input
                  type="text"
                  value={clienteNoSpidName}
                  onChange={(e) => setClienteNoSpidName(e.target.value)}
                  placeholder="Nome e Cognome Assistito..."
                  style={{ width: '100%', padding: '8px', marginBottom: '10px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }}
                />
                <input
                  type="text"
                  value={clienteNoSpidPhone}
                  onChange={(e) => setClienteNoSpidPhone(e.target.value)}
                  placeholder="Cellulare / WhatsApp..."
                  style={{ width: '100%', padding: '8px', marginBottom: '12px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }}
                />
                <button onClick={generaAccessoSenzaSpid} style={{ background: '#0d9488', color: '#fff', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>
                  Genera Link & PIN
                </button>

                {generatedToken && (
                  <div style={{ marginTop: '14px', padding: '12px', background: '#f0fdfa', borderRadius: '6px', fontSize: '13px' }}>
                    <div><strong>Cliente:</strong> {generatedToken.cliente}</div>
                    <div><strong>PIN OTP:</strong> {generatedToken.pin}</div>
                    <div><strong>Link:</strong> {generatedToken.link}</div>
                  </div>
                )}

                <div style={{ textAlign: 'right', marginTop: '15px' }}>
                  <button onClick={() => setShowNoSpidModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer' }}>
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE CASSA FIRENZE */}
          {showCassaModal && isFirenze && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '25px', borderRadius: '8px', maxWidth: '450px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>💶 Riepilogo Cassa Firenze</h3>
                <div style={{ background: '#dcfce7', padding: '12px', borderRadius: '6px', marginBottom: '10px', color: '#166534' }}>
                  Incassato effettivo: <strong>€ {totaleIncassatoFirenze.toFixed(2)}</strong>
                </div>
                <div style={{ background: '#fef3c7', padding: '12px', borderRadius: '6px', marginBottom: '10px', color: '#92400e' }}>
                  Da incassare (pratiche aperte): <strong>€ {totaleDaIncassareFirenze.toFixed(2)}</strong>
                </div>
                <div style={{ fontSize: '13px', color: '#475569' }}>
                  Totale complessivo portafoglio Firenze: <strong>€ {(totaleIncassatoFirenze + totaleDaIncassareFirenze).toFixed(2)}</strong>
                </div>
                <div style={{ textAlign: 'right', marginTop: '15px' }}>
                  <button onClick={() => setShowCassaModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer' }}>
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE CASSAFORTE */}
          {showVaultModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '25px', borderRadius: '8px', maxWidth: '520px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>🔐 Cassaforte & Portali Telematici</h3>
                {credentials.map((c) => (
                  <div key={c.id} style={{ padding: '8px 0', borderBottom: '1px solid #f1f5f9', fontSize: '13px' }}>
                    <strong>{c.sede}</strong> — {c.portale} ({c.pin})
                  </div>
                ))}
                <div style={{ textAlign: 'right', marginTop: '15px' }}>
                  <button onClick={() => setShowVaultModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer' }}>
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE TARIFFARIO BRINDISI */}
          {showBrindisiTariffModal && isBrindisi && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '25px', borderRadius: '8px', maxWidth: '500px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>⚙️ Tariffario Sede Brindisi</h3>
                {tariffarioBrindisi.map((t, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid #f1f5f9', fontSize: '13px' }}>
                    <span>{t.servizio}</span>
                    <strong>{t.studio}</strong>
                  </div>
                ))}
                <div style={{ textAlign: 'right', marginTop: '15px' }}>
                  <button onClick={() => setShowBrindisiTariffModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer' }}>
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudioFlowSuite />);
  </script>
</body>
</html>
