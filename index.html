        setUploadingFile(true);
        const nomePulito = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
        const percorso = `${prefissoCartella}/${nomePulito}`;
        try {
          if (sessionUser) {
            const { error } = await supabaseClient.storage
              .from(STORAGE_BUCKET_PRIVATO)
              .upload(percorso, file, { upsert: false });
            if (!error) {
              setUploadingFile(false);
              return {
                id: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                nome: file.name,
                dimensioneKb: Math.max(1, Math.round(file.size / 1024)),
                archiviazione: `Supabase Privato (${STORAGE_BUCKET_PRIVATO}/${percorso})`,
                data: new Date().toISOString().slice(0, 10)
              };
            }
          }
        } catch (e) {}

          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });
        setUploadingFile(false);
        return {

          nome: file.name,
          dimensioneKb: Math.max(1, Math.round(file.size / 1024)),

        let anni = oggi.getFullYear() - nascita.getFullYear();
        let mesi = oggi.getMonth() - nascita.getMonth();
        if (oggi.getDate() < nascita.getDate()) mesi -= 1;
        if (mesi < 0) { anni -= 1; mesi += 12; }
        return { anni: Math.max(0, anni), mesi: Math.max(0, mesi), decimale: Math.max(0, anni + mesi / 12) };

        const nuovoTestoStato = nuovoStatoPagata ? `Chiusa e Incassata (${p.sedeCompetenza})` : `Pronta per chiusura e incasso (${p.sedeCompetenza})`;
        if (sessionUser) {
          try { await supabaseClient.from('Pratiche').update({ pagata: nuovoStatoPagata, stato: nuovoTestoStato }).eq('id', p.id); } catch (e) {}
        }
        salvaLocale(pratiche.map(item => item.id === p.id ? { ...item, pagata: nuovoStatoPagata, stato: nuovoTestoStato, semaforo: 'verde', ultimoAggiornamento: etichettaAggiornamentoCorrente() } : item));
      };

      const eliminaPratica = async (id) => {
        if (!window.confirm('Eliminare definitivamente questa pratica?')) return;
        if (sessionUser) {
          try { await supabaseClient.from('Pratiche').delete().eq('id', id); } catch (e) {}
        }
        salvaLocale(pratiche.filter(p => p.id !== id));
        setShowModal(false);
      };

      const interrompiPromemoria = (id) => {
        salvaLocale(pratiche.map(p => p.id === id ? { ...p, promemoria: "", stato: "Pronta per ripresa", semaforo: "verde", ultimoAggiornamento: etichettaAggiornamentoCorrente() } : p));
      };

      const approvaPreventivoSuccessione = (id) => {
        salvaLocale(pratiche.map(p => p.id === id ? { ...p, preventivoAccettato: true, stato: "Preventivo Accettato", semaforo: "verde", ultimoAggiornamento: etichettaAggiornamentoCorrente() } : p));
      };

      const spostaSedePratica = (id, nuovaSede) => {
        salvaLocale(pratiche.map(p => p.id === id ? { ...p, sedeCompetenza: nuovaSede, stato: `Inoltrata a ${nuovaSede}`, ultimoAggiornamento: etichettaAggiornamentoCorrente() } : p));
        setShowModal(false);
      };

      const calcolaImponibileNuovaPratica = () => {
        if (soloCaricamentoDocumenti) return 0.00;
        if (isPersonalizzata) return Number(importoServizioPersonalizzato) || 0.00;
        return TARIFFE_SERVIZI[nuovoServizio] ?? 70.00;
      };

      const calcolaAnteprimaTotaleNuovaPratica = () => {
        if (soloCaricamentoDocumenti) return "0.00";
        const imponibile = calcolaImponibileNuovaPratica();
        const ivaAmount = nuovoCanaleIva === 'studio' ? imponibile * 0.22 : 0;
        const quotaDaPagare = (nuovoTipoCliente === 'Convenzionato' && aggiungiQuotaAssociativa) ? 25.00 : 0;
        return (imponibile + ivaAmount + quotaDaPagare).toFixed(2);
      };

      const aggiungiNuovaPratica = async () => {
        if (!nuovoClienteNome.trim()) return alert('Inserisci nome e cognome del cliente.');
        const servizioFinale = soloCaricamentoDocumenti
          ? "Solo Inserimento Documenti"
          : (isPersonalizzata ? (nomeServizioPersonalizzato.trim() || "Pratica Personalizzata") : nuovoServizio);
        const hasIva = !soloCaricamentoDocumenti && nuovoCanaleIva === 'studio';
        const imponibileCalcolato = calcolaImponibileNuovaPratica();
        const quotaImportoCalcolato = (nuovoTipoCliente === 'Convenzionato' && aggiungiQuotaAssociativa) ? 25.00 : 0;
        const incassataSubito = soloCaricamentoDocumenti || nuovaPagataSubito;
        const perimetroCalcolato = soloCaricamentoDocumenti
          ? "CAF / DSU-ISEE"
          : (servizioFinale.includes("104") || servizioFinale.includes("Invalidità") || servizioFinale.includes("Pensione")
            ? "Patronato / INPS"
            : (servizioFinale.includes("Cedolino") || servizioFinale.includes("Colf") ? "CED / Lavoro" : "Studio / Fiscale"));

        const nuova = {
          id: Date.now(),
          clientId: nuovoClienteCf.trim().toUpperCase() || `CLI${Date.now()}`,
          sedeCompetenza: isBrindisi ? "Brindisi" : "Firenze",
          perimetro: perimetroCalcolato,
          cliente: nuovoClienteNome.trim(),
          telefono: nuovoClienteTelefono.trim(),
          email: nuovoClienteEmail.trim(),
          dataRevisione: nuovaDataRevisione,
          tipoCliente: nuovoTipoCliente,
          quotaAssociativaPagata: nuovoTipoCliente === 'Convenzionato' ? !aggiungiQuotaAssociativa : false,
          quotaImporto: quotaImportoCalcolato,
          servizio: servizioFinale,
          modalitaLavorazione: "Ufficio / Sportello",
          canale: soloCaricamentoDocumenti ? "App / Link No-SPID" : (hasIva ? "Studio Commercialista" : "Esclusivo CAF"),
          stato: incassataSubito ? "Chiusa e Incassata" : (nuovaInSospeso ? "In sospeso" : "Pronta per lavorazione"),
          semaforo: (nuovaInSospeso || nuovoPromemoria || nuovaDataRevisione) ? "giallo" : "verde",
          imponibile: imponibileCalcolato,
          iva: hasIva,
          soloDocumenti: soloCaricamentoDocumenti,
          pagata: incassataSubito,
          promemoria: nuovoPromemoria || (nuovaInSospeso ? "Pratica in sospeso" : ""),
          archivioPratica: nuovoArchivioPratica,
          archivioRevisione: nuovoArchivioRevisione,
          archivioRicevute: nuovoArchivioRicevute,
          allegati: [],
          ultimoAggiornamento: etichettaAggiornamentoCorrente()
        };

        if (sessionUser) {
          try {
            await supabaseClient.from('Pratiche').insert([{
              clientId: nuova.clientId,
              sedeCompetenza: nuova.sedeCompetenza,
              cliente: nuova.cliente,
              tipoCliente: nuova.tipoCliente,
              servizio: nuova.servizio,
              canale: nuova.canale,
              stato: nuova.stato,
              imponibile: nuova.imponibile,
              iva: nuova.iva,
              soloDocumenti: nuova.soloDocumenti,
              pagata: nuova.pagata,
              promemoria: nuova.promemoria
            }]);
          } catch (e) {}
        }

        salvaLocale([nuova, ...pratiche]);
        setShowSportelloModal(false);
        setNuovoClienteNome(''); setNuovoClienteCf(''); setNuovoClienteTelefono(''); setNuovoClienteEmail('');
        setNuovaDataRevisione(''); setNuovoPromemoria(''); setNuovaPagataSubito(false); setNuovaInSospeso(false);
        setNuovoArchivioPratica(''); setNuovoArchivioRevisione(''); setNuovoArchivioRicevute('');
      };

      const registraDelegaFapi = () => {
        if (!delegaAssistitoNome.trim()) return alert('Inserisci il nome dell\'assistito.');
        salvaDelegheLocale([{
          id: Date.now(),
          assistito: delegaAssistitoNome.trim(),
          cf: delegaAssistitoCf.trim().toUpperCase() || "N/D",
          sede: isBrindisi ? "Brindisi" : "Firenze",
          ambito: delegaAmbito,
          note: delegaNote.trim(),
          data: new Date().toISOString().slice(0, 10)
        }, ...delegheRegistrate]);
        setDelegaAssistitoNome(''); setDelegaAssistitoCf(''); setDelegaNote('');
      };

      const calcolaTotale = (p) => {
        if (p.soloDocumenti) return "0.00";
        const imponibile = Number(p.imponibile || 0);
        const ivaAmount = p.iva ? imponibile * 0.22 : 0;
        const quotaDaPagare = (p.tipoCliente === 'Convenzionato' && !p.quotaAssociativaPagata) ? Number(p.quotaImporto || 25) : 0;
        return (imponibile + ivaAmount + Number(p.costiVivi || 0) + quotaDaPagare).toFixed(2);
      };

      const praticheFiltrate = (isClienteIsolato
        ? pratiche.filter(p => p.clientId === "RSSMRA80A01D612K")
        : pratiche
      ).filter((p) => {
        if (isClienteIsolato) return true;
        if (filterPerimetro !== 'tutti' && (p.perimetro || 'Studio / Fiscale') !== filterPerimetro) return false;
        const q = searchQuery.trim().toLowerCase();
        const matchTesto = !q ||
          (p.cliente || '').toLowerCase().includes(q) ||
          (p.clientId || '').toLowerCase().includes(q) ||
          (p.servizio || '').toLowerCase().includes(q);
        if (!matchTesto) return false;
        if (filterStato === 'da_incassare') return !p.pagata && !p.soloDocumenti;
        if (filterStato === 'incassate') return Boolean(p.pagata);
        if (filterStato === 'sospese') return p.semaforo === 'giallo' || Boolean(p.promemoria) || Boolean(p.dataRevisione);
        return true;
      });

      const praticheFirenze = pratiche.filter(p => p.sedeCompetenza === 'Firenze');
      const totaleIncassatoFirenze = praticheFirenze.filter(p => p.pagata).reduce((acc, p) => acc + Number(calcolaTotale(p)), 0);
      const totaleDaIncassareFirenze = praticheFirenze.filter(p => !p.pagata && !p.soloDocumenti).reduce((acc, p) => acc + Number(calcolaTotale(p)), 0);

      const generaCsvFlusso = () => {
        const righe = [
          "ID;Sede;Perimetro;Cliente;CF;Telefono;Email;DataRevisione;Servizio;Canale;Stato;Imponibile;IVA;Totale;Pagata;ArchivioPratica;ArchivioRevisione;ArchivioRicevute;UltimoAggiornamento",
          ...pratiche.map(p => [
            p.id, p.sedeCompetenza, `"${(p.perimetro || '').replace(/"/g, '""')}"`, `"${(p.cliente || '').replace(/"/g, '""')}"`,
            p.clientId || "", `"${(p.telefono || '').replace(/"/g, '""')}"`, `"${(p.email || '').replace(/"/g, '""')}"`,
            p.dataRevisione || "", `"${(p.servizio || '').replace(/"/g, '""')}"`, `"${(p.canale || '').replace(/"/g, '""')}"`,
            `"${(p.stato || '').replace(/"/g, '""')}"`, Number(p.imponibile || 0).toFixed(2), p.iva ? "22%" : "NO/ESENTE",
            calcolaTotale(p), p.pagata ? "SI" : "NO", `"${(p.archivioPratica || '').replace(/"/g, '""')}"`,
            `"${(p.archivioRevisione || '').replace(/"/g, '""')}"`, `"${(p.archivioRicevute || '').replace(/"/g, '""')}"`,
            `"${(p.ultimoAggiornamento || '').replace(/"/g, '""')}"`
          ].join(";"))
        ];
        return righe.join("\n");
      };

      const generaRiepilogoEmissioneUfficiale = () => {
        const daEmettere = praticheFirenze.filter(p => !p.soloDocumenti);
        const righe = [
          "PROSPETTO RIEPILOGATIVO PER EMISSIONE UFFICIALE / CONTABILITA' (FIRENZE)",
          `Data: ${new Date().toISOString().slice(0, 10)} | Incassato: € ${totaleIncassatoFirenze.toFixed(2)} | Da incassare: € ${totaleDaIncassareFirenze.toFixed(2)}`,
          "-------------------------------------------------------------------------",
          ...daEmettere.map(p =>
            `[${p.pagata ? 'INCASSATA' : 'APERTA'}] ${p.cliente} (CF: ${p.clientId}) | ${p.servizio} | Canale: ${p.canale} | Imponibile: € ${Number(p.imponibile || 0).toFixed(2)} | IVA: ${p.iva ? '22%' : 'No/Esente'} | Totale: € ${calcolaTotale(p)} | Ricevuta: ${p.archivioRicevute || '-'}`
          )
        ];
        return righe.join("\n");
      };

      const scaricaFileTesto = (nomeFile, contenuto) => {
        try {
          const blob = new Blob([contenuto], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = nomeFile;
          a.click();
          URL.revokeObjectURL(url);
        } catch (e) {}

      const gerarchiaFiltrata = livelloSelezionato === 'Tutti'
        ? STRUTTURA_GERARCHICA_FAPI

      if (authChecked && !sessionUser && !anteprimaLocaleAttiva) {
        return (

              <p style={{ margin: '0 0 18px 0', fontSize: '13px', color: '#64748b' }}>
                Accedi con il tuo account operatore su Supabase oppure entra in anteprima locale.
              </p>
              <form onSubmit={effettuaLogin}>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', marginBottom: '4px' }}>Email Operatore</label>
                <input type="email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} placeholder="operatore@studio.it" style={{ width: '100%', padding: '9px 10px', marginBottom: '12px', borderRadius: '6px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', marginBottom: '4px' }}>Password</label>
                <input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="••••••••" style={{ width: '100%', padding: '9px 10px', marginBottom: '14px', borderRadius: '6px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                {loginError && <div style={{ background: '#fef2f2', border: '1px solid #fecaca', color: '#b91c1c', padding: '8px 10px', borderRadius: '6px', fontSize: '12px', marginBottom: '12px' }}>{loginError}</div>}
                <button type="submit" disabled={loginLoading} style={{ width: '100%', background: '#2563eb', color: '#fff', border: 'none', padding: '10px 14px', borderRadius: '6px', fontWeight: '700', cursor: 'pointer', fontSize: '14px' }}>
                  {loginLoading ? 'Accesso in corso...' : 'Accedi con Account Studio'}
                </button>
              </form>
              <div style={{ marginTop: '14px', paddingTop: '14px', borderTop: '1px solid #e2e8f0' }}>
                <button type="button" onClick={() => setAnteprimaLocaleAttiva(true)} style={{ background: '#f8fafc', color: '#334155', border: '1px solid #cbd5e1', padding: '8px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: '600', cursor: 'pointer', width: '100%' }}>
                  🧪 Continua in Anteprima Locale (Browser)
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div style={{ fontFamily: 'Segoe UI, sans-serif', backgroundColor: '#f4f6f9', minHeight: '100vh', color: '#333' }}>
          <header style={{ backgroundColor: isBrindisi ? '#7c2d12' : isClienteIsolato ? '#0f766e' : '#1e293b', color: '#fff', padding: '15px 30px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
            <div>
              <h2 style={{ margin: 0, fontSize: '20px', fontWeight: '750' }}>
                {isBrindisi ? '🏛️ Studio Brindisi (Autonomo)' : isClienteIsolato ? '🛡️ Area Caricamento Protetto No-SPID' : '🏢 Studio Firenze (Sede Centrale)'}
                <span style={{ fontSize: '11px', background: isFirenze ? '#3b82f6' : isBrindisi ? '#ea580c' : '#14b8a6', padding: '3px 8px', borderRadius: '4px', marginLeft: '10px' }}>
                  {isFirenze ? 'TITOLARE FIRENZE' : isBrindisi ? 'SEDE BRINDISI' : 'AREA ASSISTITO ISOLATA'}
                </span>
                {!isClienteIsolato && (
                  <span style={{ fontSize: '11px', background: 'rgba(255,255,255,0.15)', padding: '3px 8px', borderRadius: '4px', marginLeft: '8px', fontWeight: 'normal' }}>
                    💾 {dbStatus}
                  </span>
                )}
              </h2>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
              <select value={currentProfile} onChange={(e) => { setCurrentProfile(e.target.value); setActiveTab('dashboard'); setSessioneSbloccata(false); setOtpInserito(''); }} style={{ background: '#1e293b', color: '#fff', border: '1px solid #475569', borderRadius: '4px', padding: '6px 8px', fontSize: '13px', fontWeight: 'bold' }}>
                <option value="mio_studio">Studio Firenze (Titolare)</option>
                <option value="brindisi">Studio Brindisi</option>

              </select>
              {isBrindisi && <button onClick={() => setShowBrindisiTariffModal(true)} style={{ background: '#ea580c', color: '#fff', border: 'none', padding: '8px 14px', borderRadius: '6px', cursor: 'pointer', fontSize: '13px', fontWeight: '600' }}>⚙️ Tariffario Brindisi</button>}
              {isFirenze && <button onClick={() => setShowCassaModal(true)} style={{ background: '#d97706', color: '#fff', border: 'none', padding: '8px 14px', borderRadius: '6px', cursor: 'pointer', fontSize: '13px', fontWeight: '600' }}>💶 Cassa Firenze (€ {totaleIncassatoFirenze.toFixed(2)})</button>}
              {!isClienteIsolato && <button onClick={() => setShowVaultModal(true)} style={{ background: '#059669', color: '#fff', border: 'none', padding: '8px 14px', borderRadius: '6px', cursor: 'pointer', fontSize: '13px', fontWeight: '600' }}>🔐 Cassaforte</button>}
              <button onClick={effettuaLogout} style={{ background: 'rgba(255,255,255,0.16)', color: '#fff', border: '1px solid rgba(255,255,255,0.3)', padding: '7px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>{sessionUser ? 'Esci' : 'Login'}</button>
            </div>
          </header>

          {!isClienteIsolato && (
            <nav style={{ background: '#fff', padding: '0 30px', borderBottom: '1px solid #e2e8f0', display: 'flex', gap: '20px', overflowX: 'auto' }}>
              {[
                ['dashboard', '📥 Coda Pratiche & Archivio'],
                ['storico_annate', '🗂️ Storico Annate (CU / 730 / DSU-ISEE)'],
                ['prenotazioni', '📅 Prenotazioni & Flusso Sportello'],
                ['pensioni', '📊 Previdenza & Pensioni'],
                ['invalidita104', '♿ Invalidità, Inabilità & L. 104'],
                ['fapi_rete', '🏛️ Rete Fapi & Delega Unica'],
                ['tariffario', `📋 Listini (${isBrindisi ? 'Brindisi' : 'Firenze'})`],
                ['isee_check', '🔍 Verifica CF ISEE'],
                ['immigrazione', '🌍 Immigrazione']
              ].map(([id, label]) => (
                <button key={id} onClick={() => setActiveTab(id)} style={{ padding: '15px 10px', background: 'none', border: 'none', borderBottom: activeTab === id ? '3px solid #2563eb' : '3px solid transparent', fontWeight: activeTab === id ? 'bold' : 'normal', color: activeTab === id ? '#2563eb' : '#64748b', cursor: 'pointer', whiteSpace: 'nowrap' }}>
                  {label}
                </button>
              ))}

          <main style={{ padding: '30px', maxWidth: '1400px', margin: '0 auto' }}>
            {isClienteIsolato ? (
              <div style={{ maxWidth: '750px', margin: '0 auto' }}>

                    <p style={{ fontSize: '14px', color: '#475569', marginBottom: '20px' }}>Inserisci il PIN a 6 cifre (es. <code>123456</code>) per accedere alla cartella di <strong>Mario Rossi</strong>.</p>
                    <div style={{ display: 'flex', justifyContent: 'center', gap: '10px' }}>
                      <input type="text" maxLength={6} value={otpInserito} onChange={(e) => setOtpInserito(e.target.value)} placeholder="123456" style={{ padding: '12px', fontSize: '18px', textAlign: 'center', width: '160px', borderRadius: '6px', border: '2px solid #0d9488' }} />
                      <button onClick={() => otpInserito.length === 6 ? setSessioneSbloccata(true) : alert('Inserisci 6 cifre')} style={{ background: '#0d9488', color: '#fff', border: 'none', padding: '12px 24px', borderRadius: '6px', fontWeight: 'bold', cursor: 'pointer' }}>Sblocca</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ background: '#f0fdfa', border: '1px solid #99f6e4', padding: '20px', borderRadius: '8px' }}>
                    <h3 style={{ margin: '0 0 8px 0', color: '#0f766e' }}>Cartella di Mario Rossi (€ 0,00)</h3>
                    <label style={{ display: 'inline-block', background: '#0f766e', color: '#fff', padding: '10px 18px', borderRadius: '6px', fontWeight: '600', cursor: 'pointer', fontSize: '14px' }}>
                      {uploadingFile ? 'Caricamento...' : '📸 Carica Documento / Foto'}
                      <input type="file" accept=".pdf,image/*" style={{ display: 'none' }} onChange={async (e) => {
                        const f = e.target.files?.[0];
                        if (!f) return;
                        const all = await caricaFileSuArchivio(f, 'no-spid/mario-rossi');
                        if (all) setAllegatiNoSpid((prev) => [all, ...prev]);
                        e.target.value = '';

                    </label>
                    {allegatiNoSpid.map((a) => <div key={a.id} style={{ marginTop: '8px', fontSize: '12px' }}>📎 <strong>{a.nome}</strong> ({a.dimensioneKb} KB) — <em>{a.archiviazione}</em></div>)}
                  </div>
                )}
              </div>
            ) : (
              <>
                {praticheConRevisione.length > 0 && (
                  <div style={{ background: '#fffbeb', border: '1px solid #fcd34d', borderRadius: '8px', padding: '12px 16px', marginBottom: '18px', fontSize: '13px', color: '#92400e' }}>
                    🔔 <strong>Promemoria / Revisioni:</strong> hai <strong>{praticheConRevisione.length}</strong> pratiche con revisione o promemoria attivo.
                  </div>
                )}

                {activeTab === 'dashboard' && (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '10px' }}>
                      <div>
                        <h3 style={{ margin: 0 }}>{isBrindisi ? "Cruscotto Sede Brindisi" : "Cruscotto Operativo Studio Firenze"}</h3>
                        <p style={{ margin: '4px 0 0 0', color: '#64748b', fontSize: '13px' }}>Pratiche, allegati, avvisi contatti ed esportazione verso canali ufficiali.</p>

                        <button onClick={() => { setExportTab('flussi'); setShowExportModal(true); }} style={{ background: '#475569', color: '#fff', border: 'none', padding: '10px 14px', borderRadius: '6px', fontWeight: '600', cursor: 'pointer', fontSize: '13px' }}>📤 Esportazione & Canale Ufficiale</button>
                        <button onClick={() => { setGeneratedToken(null); setShowNoSpidModal(true); }} style={{ background: '#0d9488', color: '#fff', border: 'none', padding: '10px 16px', borderRadius: '6px', fontWeight: '600', cursor: 'pointer', fontSize: '13px' }}>📲 Link No-SPID</button>
                        <button onClick={() => setShowSportelloModal(true)} style={{ background: isBrindisi ? '#ea580c' : '#2563eb', color: '#fff', border: 'none', padding: '10px 18px', borderRadius: '6px', fontWeight: '600', cursor: 'pointer', fontSize: '13px' }}>+ Nuova Pratica</button>
                      </div>

                <div style={{ display: 'flex', gap: '8px', marginBottom: '12px' }}>
                  <button type="button" onClick={() => setExportTab('flussi')} style={{ background: exportTab === 'flussi' ? '#1e293b' : '#e2e8f0', color: exportTab === 'flussi' ? '#fff' : '#334155', border: 'none', padding: '7px 12px', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>CSV Flussi (QWeb / Cesac / INPS / AdE)</button>
                  <button type="button" onClick={() => setExportTab('emissione')} style={{ background: exportTab === 'emissione' ? '#1e293b' : '#e2e8f0', color: exportTab === 'emissione' ? '#fff' : '#334155', border: 'none', padding: '7px 12px', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>Prospetto Emissione Ufficiale</button>
                </div>
                {exportTab === 'flussi' ? (
                  <>
                    <textarea readOnly value={generaCsvFlusso()} rows={9} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #cbd5e1', fontSize: '11px', fontFamily: 'monospace', boxSizing: 'border-box' }} />
                    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px', marginTop: '12px' }}>
                      <button onClick={() => { navigator.clipboard?.writeText(generaCsvFlusso()); alert('CSV copiato!'); }} style={{ background: '#2563eb', color: '#fff', border: 'none', padding: '8px 12px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px' }}>Copia CSV</button>
                      <button onClick={() => scaricaFileTesto('flusso_pratiche_studioflow.csv', generaCsvFlusso())} style={{ background: '#059669', color: '#fff', border: 'none', padding: '8px 12px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px' }}>Scarica .CSV</button>
                      <button onClick={() => setShowExportModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 12px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px' }}>Chiudi</button>
                    </div>
                  </>
                ) : (
                  <>
                    <textarea readOnly value={generaRiepilogoEmissioneUfficiale()} rows={9} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #cbd5e1', fontSize: '11px', fontFamily: 'monospace', boxSizing: 'border-box' }} />
                    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px', marginTop: '12px' }}>
                      <button onClick={() => { navigator.clipboard?.writeText(generaRiepilogoEmissioneUfficiale()); alert('Prospetto copiato!'); }} style={{ background: '#2563eb', color: '#fff', border: 'none', padding: '8px 12px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px' }}>Copia Riepilogo</button>
                      <button onClick={() => scaricaFileTesto('prospetto_emissione_ufficiale.txt', generaRiepilogoEmissioneUfficiale())} style={{ background: '#059669', color: '#fff', border: 'none', padding: '8px 12px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px' }}>Scarica .TXT</button>
                      <button onClick={() => setShowExportModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '8px 12px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px' }}>Chiudi</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {showNoSpidModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '24px', borderRadius: '8px', maxWidth: '440px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>📲 Genera Link & PIN No-SPID</h3>
                <input type="text" value={clienteNoSpidName} onChange={(e) => setClienteNoSpidName(e.target.value)} placeholder="Nome Assistito..." style={{ width: '100%', padding: '8px', marginBottom: '8px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                <input type="text" value={clienteNoSpidPhone} onChange={(e) => setClienteNoSpidPhone(e.target.value)} placeholder="Cellulare..." style={{ width: '100%', padding: '8px', marginBottom: '10px', borderRadius: '4px', border: '1px solid #cbd5e1', boxSizing: 'border-box' }} />
                <button onClick={generaAccessoSenzaSpid} style={{ background: '#0d9488', color: '#fff', border: 'none', padding: '8px 14px', borderRadius: '4px', cursor: 'pointer' }}>Genera</button>
                {generatedToken && <div style={{ marginTop: '12px', fontSize: '12px', background: '#f0fdfa', padding: '10px', borderRadius: '6px' }}>PIN: <strong>{generatedToken.pin}</strong> • Link: {generatedToken.link}</div>}
                <div style={{ textAlign: 'right', marginTop: '14px' }}><button onClick={() => setShowNoSpidModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '7px 12px', borderRadius: '4px', cursor: 'pointer' }}>Chiudi</button></div>
              </div>
            </div>
          )}

          {showCassaModal && isFirenze && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '24px', borderRadius: '8px', maxWidth: '420px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>💶 Cassa Firenze</h3>
                <div style={{ marginBottom: '8px' }}>Incassato: <strong>€ {totaleIncassatoFirenze.toFixed(2)}</strong></div>
                <div style={{ marginBottom: '12px' }}>Da incassare: <strong>€ {totaleDaIncassareFirenze.toFixed(2)}</strong></div>
                <button onClick={() => setShowCassaModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '7px 12px', borderRadius: '4px', cursor: 'pointer' }}>Chiudi</button>
              </div>
            </div>
          )}

          {showVaultModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '24px', borderRadius: '8px', maxWidth: '480px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>🔐 Cassaforte & Portali</h3>
                {credentials.map((c) => <div key={c.id} style={{ padding: '6px 0', borderBottom: '1px solid #f1f5f9', fontSize: '13px' }}><strong>{c.sede}:</strong> {c.portale} ({c.pin})</div>)}
                <div style={{ textAlign: 'right', marginTop: '14px' }}><button onClick={() => setShowVaultModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '7px 12px', borderRadius: '4px', cursor: 'pointer' }}>Chiudi</button></div>
              </div>
            </div>
          )}

          {showBrindisiTariffModal && isBrindisi && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px' }}>
              <div style={{ background: '#fff', padding: '24px', borderRadius: '8px', maxWidth: '460px', width: '100%' }}>
                <h3 style={{ marginTop: 0 }}>⚙️ Tariffario Brindisi</h3>
                {tariffarioBrindisi.map((t, i) => <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px solid #f1f5f9', fontSize: '13px' }}><span>{t.servizio}</span><strong>{t.studio}</strong></div>)}
                <div style={{ textAlign: 'right', marginTop: '14px' }}><button onClick={() => setShowBrindisiTariffModal(false)} style={{ background: '#cbd5e1', border: 'none', padding: '7px 12px', borderRadius: '4px', cursor: 'pointer' }}>Chiudi</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudioFlowSuite />);
  </script>
</body>
</html>
